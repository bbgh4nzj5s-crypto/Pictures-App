
name: Make image ZIP

on:
  workflow_dispatch:

jobs:
  make_zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download images
        run: python download_images.py --dans oa1,oa2,oa3,oa4
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: coordinate-image-zip
          path: aipri_images_*.zip
          retention-days: 7
